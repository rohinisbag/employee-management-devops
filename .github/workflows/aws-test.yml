name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: write
      pull-requests: write
      deployments: read
      checks: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767397764201:role/devops-deployment-role
          role-session-name: GitHubActions
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity